environment: webshop

simulator:
  model: Qwen/Qwen3.5-397B-A17B
  api_base: localhost:8000/v1
  api_key: EMPTY
  temperature: 0.3
  max_tokens: 4096
  concurrency: 100

embedding:
  model: BAAI/bge-m3
  device: cuda
  batch_size: 64

data:
  replay_traces: data/webshop/replay_traces.jsonl
  arbitration_traces: data/webshop/arbitration_traces.jsonl
  output_dir: outputs/webshop
  test_traces: replaybench/webshop/test.jsonl

repertoire:
  initial: repertoires/webshop_initial
  selected: repertoires/webshop
  skill_body_cap: 5000

clusters:
  first_level: 100
  leaves_per_node: 10
  min_split_size: 20
  seed: 42

evolve:
  n_pre: 2000
  n_sl: 1000
  batch_size: 200
  n_step: 1
  cycle_cap: 15
  patience: 5
  arbitration_sample: 300
  frequency_threshold: 0.0
  consolidation_period: 5
  consolidation_overlap: 0.7
  max_deletes_per_cycle: 2
  replay_thinking: true
  seed: 42

harness:
  capabilities: [coding]
  replay_capabilities: []
  reply_cap: 4
  reply_cap_with_tool_group: 6
  format_exemplar: harness_inputs/webshop/format_exemplar.md
  shell_note: harness_inputs/shell_note.md
  shell_timeout: 30
  simulation_max_tokens: 32768

agent:
  model: Qwen/Qwen3.5-397B-A17B
  api_base: localhost:8000/v1
  api_key: EMPTY
  concurrency: 32

judge:
  model: gpt-5.6-terra
  api_base: ""
  api_key: EMPTY
  reasoning_effort: medium
  max_tokens: 16384
  concurrency: 8

action_preserve_judge:
  model: gpt-oss-120b
  api_base: localhost:8001/v1
  api_key: EMPTY
  max_tokens: 8192
  concurrency: 8
